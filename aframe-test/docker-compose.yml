version: '3.8'

services:
  caddy:
    image: caddy:latest
    container_name: caddy-server
    ports:
      - "8080:80"
      - "4430:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - .:/usr/share/caddy
      - caddy_data:/data
      - caddy_config:/config
    
    command: caddy run --config /etc/caddy/Caddyfile --watch

volumes:
  caddy_data:
  caddy_config: